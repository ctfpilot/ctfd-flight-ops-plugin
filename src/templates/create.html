{% extends "admin/challenges/create.html" %}

{% block name %}
<div class="form-group">
    <label>
        Name:<br>
        <small class="form-text text-muted">The name of your challenge</small>
    </label>
    <input type="text" class="form-control" name="name" placeholder="Enter challenge name" required>
</div>

<div class="form-group">
    <label for="template_name">
        Flight Plan Name<br>
        <small class="form-text text-muted">
            The Kubernetes FlightPlan name exposed by the Flight Ops dispatcher.
        </small>
    </label>
    <input type="text" class="form-control" name="template_name" placeholder="example-flight-plan" required>
</div>

<div class="form-group">
    <label for="instance_type">
        Instance Type Hint (optional)<br>
        <small class="form-text text-muted">
            Optional label for editors. Runtime connection strings are rendered from dispatcher status.
        </small>
    </label>
    <input type="text" class="form-control" name="instance_type" placeholder="web,tcp">
</div>
{% endblock %}

{% block value %}
<div class="form-group">
    <label for="value">
        Initial Value<br>
        <small class="form-text text-muted">Initial challenge points.</small>
    </label>
    <input type="number" class="form-control" name="initial" placeholder="Enter value" required>
</div>

<div class="form-group">
    <label for="value">
        Decay Function<br>
        <small class="form-text text-muted">
            <span>How dynamic value is calculated from solve count.</span>
            <ul>
                <li>Linear: Initial - (Decay * SolveCount)</li>
                <li>Logarithmic: curved drop toward minimum value</li>
                <li>Logarithmic Custom: same as logarithmic with CTFd custom formula</li>
            </ul>
        </small>
    </label>
    <select name="function" class="custom-select">
        <option value="linear">Linear</option>
        <option value="logarithmic">Logarithmic</option>
        <option value="logarithmic_custom">Logarithmic Custom</option>
    </select>
</div>

<div class="form-group">
    <label for="value">
        Decay<br>
        <small class="form-text text-muted">The decay parameter for the selected function.</small>
    </label>
    <input type="number" class="form-control" name="decay" min="1" placeholder="Enter decay" required>
</div>

<div class="form-group">
    <label for="value">
        Minimum Value<br>
        <small class="form-text text-muted">Minimum challenge points.</small>
    </label>
    <input type="number" class="form-control" name="minimum" placeholder="Enter minimum value" required>
</div>
{% endblock %}

{% block type %}
<input type="hidden" value="flightops" name="type" id="chaltype">
{% endblock %}
