{% extends "admin/challenges/update.html" %}

{% block name %}
<div class="form-group">
    <label>
        Name:<br>
        <small class="form-text text-muted">The name of your challenge</small>
    </label>
    <input type="text" class="form-control" name="name" value="{{ challenge.name }}" required>
</div>

<div class="form-group">
    <label for="template_name">
        Flight Plan Name<br>
        <small class="form-text text-muted">The Kubernetes FlightPlan name in Flight Ops.</small>
    </label>
    <input type="text" class="form-control" name="template_name" value="{{ challenge.template_name }}" required>
</div>

<div class="form-group">
    <label for="instance_type">
        Instance Type Hint (optional)<br>
        <small class="form-text text-muted">Optional label for editors only.</small>
    </label>
    <input type="text" class="form-control" name="instance_type" value="{{ challenge.instance_type }}">
</div>
{% endblock %}

{% block value %}
<div class="form-group">
    <label for="value">
        Current Value<br>
        <small class="form-text text-muted">Current challenge points.</small>
    </label>
    <input type="number" class="form-control chal-value" name="value" value="{{ challenge.value }}" disabled>
</div>

<div class="form-group">
    <label for="value">
        Initial Value<br>
        <small class="form-text text-muted">Initial challenge points.</small>
    </label>
    <input type="number" class="form-control chal-initial" name="initial" value="{{ challenge.initial }}" required>
</div>

<div class="form-group">
    <label for="value">
        Decay Function<br>
        <small class="form-text text-muted">How dynamic value is calculated.</small>
    </label>
    <select name="function" class="custom-select">
        <option value="linear" {% if challenge.function=="linear" %}selected{% endif %}>Linear</option>
        <option value="logarithmic" {% if challenge.function=="logarithmic" %}selected{% endif %}>Logarithmic</option>
        <option value="logarithmic_custom" {% if challenge.function=="logarithmic_custom" %}selected{% endif %}>
            Logarithmic Custom</option>
    </select>
</div>

<div class="form-group">
    <label for="value">
        Decay<br>
        <small class="form-text text-muted">Decay parameter.</small>
    </label>
    <input type="number" class="form-control chal-decay" min="1" name="decay" value="{{ challenge.decay }}" required>
</div>

<div class="form-group">
    <label for="value">
        Minimum Value<br>
        <small class="form-text text-muted">Minimum challenge points.</small>
    </label>
    <input type="number" class="form-control chal-minimum" name="minimum" value="{{ challenge.minimum }}" required>
</div>
{% endblock %}
